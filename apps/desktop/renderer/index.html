<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline'" />
    <title>SCC Platform</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="titlebar">
      <div class="titlebar__brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5.5 4.6h2.2l1.4 3.4-1.8 1.3a10 10 0 0 0 5.1 5.1l1.3-1.8 3.4 1.4v2.2a1.8 1.8 0 0 1-1.9 1.8A14.4 14.4 0 0 1 3.7 6.5a1.8 1.8 0 0 1 1.8-1.9Z" />
            <path d="M15.4 4.1a6.5 6.5 0 0 1 4.4 4.4" />
            <path d="M14.8 7.5a3.1 3.1 0 0 1 1.9 1.9" />
          </svg>
        </span>
        <span class="titlebar__text">
          <strong>SCC Platform</strong>
          <small>Synergy Call Center · МТИ</small>
        </span>
      </div>
      <div class="titlebar__status">
        <span class="dot" id="live-dot"></span>
        <span id="live-label">проверяю сервисы…</span>
      </div>
      <div class="titlebar__controls">
        <button data-action="minimize" aria-label="Свернуть" title="Свернуть"></button>
        <button data-action="toggle" aria-label="Развернуть" title="Развернуть"></button>
        <button data-action="close" class="danger" aria-label="Закрыть" title="Закрыть"></button>
      </div>
    </div>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar__caption">сервисы</div>
        <div class="search">
          <span class="search__icon" id="search-icon"></span>
          <input id="search" class="search__input" type="search" placeholder="Поиск · 1–8" autocomplete="off" />
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="sidebar__foot">
          <button id="start-all" class="button button--brand"></button>
          <button id="stop-all" class="button"></button>
        </div>
      </aside>

      <main class="main">
        <div class="banner" id="banner" hidden>
          <div class="banner__text">
            <strong><span id="banner-icon"></span>Сервис не отвечает</strong>
            <span>Показаны демо-данные. Поднимите бэкенд — экран переключится в live.</span>
          </div>
          <div class="banner__actions">
            <button class="button button--brand" data-start-service></button>
            <button class="button" data-dismiss-banner>Скрыть</button>
          </div>
        </div>

        <header class="page-head">
          <div class="page-head__main">
            <span class="page-head__icon" id="page-icon"></span>
            <div>
              <div class="page-head__eyebrow" id="eyebrow">SCC Platform</div>
              <h1 id="title">Загрузка…</h1>
              <p id="subtitle" class="page-head__subtitle"></p>
            </div>
          </div>
          <div class="page-head__aside">
            <span class="pill" id="mode-pill">демо</span>
            <span class="pill pill--ghost" id="port-pill">:0000</span>
            <button id="refresh" class="button" title="Ctrl+R"></button>
          </div>
        </header>

        <section class="kpis" id="kpis"></section>

        <section class="split">
          <div class="panel">
            <div class="panel__head">
              <h2 id="table-title">Показатели</h2>
              <div class="panel__tools">
                <span class="panel__hint" id="table-hint"></span>
                <button id="export" class="button button--compact" title="Скачать CSV"></button>
              </div>
            </div>
            <div class="panel__body" id="table"></div>
          </div>
          <div class="panel panel--aside">
            <div class="panel__head">
              <h2>Контур</h2>
            </div>
            <div class="panel__body" id="side"></div>
          </div>
        </section>

        <footer class="footer">
          <span>SCC Platform · Синергия · контур телефонии МТИ</span>
          <span class="mono" id="clock"></span>
        </footer>
      </main>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="icons.js"></script>
    <script src="viz.js"></script>
    <script src="illustrations.js"></script>
    <script src="app.js"></script>
  </body>
</html>
