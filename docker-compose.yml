name: scc-platform

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: scc-postgres
    environment:
      POSTGRES_USER: scc
      POSTGRES_PASSWORD: scc
      POSTGRES_DB: scc
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scc -d scc"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgbackup:
    image: postgres:16-alpine
    container_name: scc-pgbackup
    environment:
      PGPASSWORD: scc
    entrypoint: >
      sh -c "while true; do pg_basebackup -h postgres -U scc -D /backup/base -Ft -z -X stream;
      sleep 86400; done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgbackup:/backup

  nats:
    image: nats:2.11-alpine
    container_name: scc-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data

  kafka:
    image: bitnami/kafka:3.9
    container_name: scc-kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/bitnami/kafka

  freeswitch:
    image: safarov/freeswitch:latest
    container_name: scc-freeswitch
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8021:8021/tcp"
      - "16384-16484:16384-16484/udp"
    environment:
      ESL_PASSWORD: ClueCon
    volumes:
      - ./deploy/freeswitch/dialplan.xml:/etc/freeswitch/dialplan/default.xml:ro

volumes:
  pgdata:
  pgbackup:
  natsdata:
  kafkadata:
